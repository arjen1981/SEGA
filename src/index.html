<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEGA Arcade Graph</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- vis-network CDN — single script, zero dependencies (~95 KB gzipped) -->
  <script src="https://unpkg.com/vis-network@10/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <a href="#graph-container" class="skip-link">Skip to graph</a>

  <header class="app-header" role="banner">
    <h1 class="app-title">SEGA Arcade Universe</h1>
    <div class="search-container">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Search nodes…"
        aria-label="Search for a node by name"
        autocomplete="off"
      >
      <ul id="search-suggestions" class="search-suggestions" role="listbox" hidden></ul>
    </div>
  </header>

  <main class="app-main">
    <div id="filter-toolbar" class="filter-toolbar" role="toolbar" aria-label="Filter node types">
      <label class="filter-checkbox">
        <input type="checkbox" data-group="studio" checked>
        <span class="filter-swatch" style="background-color: var(--color-studio);"></span>
        Studios
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="platform" checked>
        <span class="filter-swatch" style="background-color: var(--color-platform);"></span>
        Platforms
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="game" checked>
        <span class="filter-swatch" style="background-color: var(--color-game);"></span>
        Games
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="creator" checked>
        <span class="filter-swatch" style="background-color: var(--color-creator);"></span>
        Creators
      </label>
    </div>
    <div id="graph-container" class="graph-container">
      <div id="loading-spinner" class="loading-spinner" aria-live="polite">
        Loading graph…
      </div>
    </div>
  </main>

  <aside id="detail-panel" class="detail-panel" role="complementary" aria-label="Node details" hidden>
    <button id="detail-close" class="detail-close" aria-label="Close detail panel">&times;</button>
    <div id="detail-content" class="detail-content"></div>
  </aside>

  <nav class="legend-bar" aria-label="Node type legend">
    <span class="legend-item">
      <span class="legend-swatch" style="background-color: var(--color-company);"></span>
      Company
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="background-color: var(--color-studio);"></span>
      Studio
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="background-color: var(--color-platform);"></span>
      Platform
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="background-color: var(--color-game);"></span>
      Game
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="background-color: var(--color-creator);"></span>
      Creator
    </span>
  </nav>

  <footer class="attribution" role="contentinfo">
    <p>
      Data sourced from <a href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia</a>
      (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>)
      and <a href="https://www.wikidata.org/" target="_blank" rel="noopener noreferrer">Wikidata</a>
      (<a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener noreferrer">CC0</a>).
      Graph rendered with <a href="https://visjs.github.io/vis-network/" target="_blank" rel="noopener noreferrer">vis-network</a>
      (MIT License).
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
