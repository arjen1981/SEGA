<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEGA Arcade Graph</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- vis-network CDN — single script, zero dependencies (~95 KB gzipped) -->
  <script src="https://unpkg.com/vis-network@10/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <a href="#graph-container" class="skip-link">Skip to graph</a>

  <header class="app-header" role="banner">
    <h1 class="app-title">SEGA Arcade Universe</h1>
    <div class="search-container">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Search games, creators, platforms…"
        aria-label="Search for games, creators, platforms and more"
        autocomplete="off"
      >
      <ul id="search-suggestions" class="search-suggestions" role="listbox" hidden></ul>
    </div>
  </header>

  <main class="app-main">
    <div id="filter-toolbar" class="filter-toolbar" role="toolbar" aria-label="Filter node types">
      <label class="filter-checkbox">
        <input type="checkbox" data-group="studio" checked>
        <span class="filter-swatch" data-group="studio"></span>
        Studios
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="platform" checked>
        <span class="filter-swatch" data-group="platform"></span>
        Platforms
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="game" checked>
        <span class="filter-swatch" data-group="game"></span>
        Games
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" data-group="creator" checked>
        <span class="filter-swatch" data-group="creator"></span>
        Creators
      </label>
    </div>
    <div id="graph-container" class="graph-container">
      <div id="loading-spinner" class="loading-spinner" aria-live="polite">
        Loading graph…
      </div>
    </div>
  </main>

  <aside id="detail-panel" class="detail-panel" role="complementary" aria-label="Node details" aria-expanded="false" hidden>
    <button id="detail-close" class="detail-close" aria-label="Close detail panel">&times;</button>
    <div id="detail-content" class="detail-content"></div>
  </aside>

  <footer class="legend-bar" role="contentinfo" aria-label="Node type legend and attribution">
    <div class="legend-items">
      <span class="legend-item">
        <span class="legend-swatch" data-group="company"></span>
        Company
      </span>
      <span class="legend-item">
        <span class="legend-swatch" data-group="studio"></span>
        Studio
      </span>
      <span class="legend-item">
        <span class="legend-swatch" data-group="platform"></span>
        Platform
      </span>
      <span class="legend-item">
        <span class="legend-swatch" data-group="game"></span>
        Game
      </span>
      <span class="legend-item">
        <span class="legend-swatch" data-group="creator"></span>
        Creator
      </span>
    </div>
    <span class="attribution">
      Data from <a href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia</a>
      · <a href="https://www.wikidata.org/" target="_blank" rel="noopener noreferrer">Wikidata</a>
      · <a href="https://www.igdb.com/" target="_blank" rel="noopener noreferrer">IGDB</a>.
      Graph: <a href="https://visjs.github.io/vis-network/" target="_blank" rel="noopener noreferrer">vis-network</a>.
    </span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
